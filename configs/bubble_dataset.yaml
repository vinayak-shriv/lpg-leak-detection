# Dataset config for training. Paths are relative to this file.
#
# Generated by scripts/split_dataset.py. Re-run that script after adding
# new labelled frames, then retrain.
#
# nc was 2 ('bubble', 'large_leak') in an earlier version of this project,
# but every label in the dataset uses class 0, so the second class head was
# never trained. Severity is inferred at runtime from bubble rate and
# per-cylinder score instead (see src/lpgdetect/overlays.py).

path: ../dataset
train: images/train
val: images/val

nc: 1
names: ['bubble']
