[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpgdetect"
version = "0.2.0"
description = "Bubble-based leak detection for LPG cylinder water bath testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.1.0,<9.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<3.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
upload = ["roboflow>=1.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
